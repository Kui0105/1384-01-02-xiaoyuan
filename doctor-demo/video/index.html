<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>视频课堂</title>
    <link rel="stylesheet" href="/assets/layui/css/layui.css" media="all">
    <style>
        body { background:#f5f7fa; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif; padding:16px; }
        .card { background:#fff; border-radius:8px; padding:16px; }
        .page-title { font-size:17px; font-weight:600; color:#333; margin-bottom:14px; }
        .page-title .layui-icon { color:#3A91FB; margin-right:6px; }
        .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; border-bottom:1px solid #eee; padding-bottom:12px; }
        .tab { padding:7px 18px; border-radius:18px; cursor:pointer; font-size:13px; color:#666; background:#f5f5f5; transition:all .15s; user-select:none; }
        .tab:hover { color:#3A91FB; background:#EBF4FF; }
        .tab.active { color:#fff; background:#3A91FB; }
        .video-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
        .video-item { border:1px solid #eef0f3; border-radius:8px; overflow:hidden; cursor:pointer; background:#fff; transition:all .18s; }
        .video-item:hover { box-shadow:0 8px 22px rgba(0,0,0,.1); transform:translateY(-2px); }
        .video-cover { height:150px; position:relative; display:flex; align-items:center; justify-content:center; }
        .play-btn { width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; font-size:26px; color:#3A91FB; }
        .duration { position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:2px 8px; border-radius:4px; }
        .video-body { padding:12px 14px; }
        .video-title { font-size:14px; color:#333; line-height:1.5; height:42px; overflow:hidden; }
        .video-meta { font-size:11px; color:#aaa; margin-top:8px; display:flex; justify-content:space-between; }
    </style>
<script src="/assets/demo-auth.js"></script>
</head>
<body>
    <div class="card">
        <div class="page-title"><i class="layui-icon layui-icon-video"></i>视频课堂</div>
        <div class="tabs" id="tabs"></div>
        <div class="video-grid" id="list"></div>
    </div>

<script src="/assets/layui/layui.js"></script>
<script>
    var MOCK_CATS = [
        {id:1,name:'全部'}, {id:2,name:'生长发育'}, {id:3,name:'喂养指导'},
        {id:4,name:'疾病预防'}, {id:5,name:'亲子教育'}
    ];
    var MOCK_VIDEOS = [
        {id:1,cat:2,title:'儿童身高管理的科学方法',views:3520,duration:'12:36',color:'#3A91FB'},
        {id:2,cat:2,title:'看懂孩子的生长曲线图',views:2180,duration:'08:42',color:'#16b777'},
        {id:3,cat:3,title:'0-6岁辅食添加全指南',views:4602,duration:'18:20',color:'#FF8B3D'},
        {id:4,cat:3,title:'孩子挑食？试试这些创意做法',views:1936,duration:'10:15',color:'#8B5CF6'},
        {id:5,cat:4,title:'手足口病预防与护理',views:2875,duration:'09:48',color:'#3A91FB'},
        {id:6,cat:4,title:'儿童过敏原检测知多少',views:1542,duration:'14:05',color:'#16b777'},
        {id:7,cat:5,title:'如何与孩子有效沟通',views:3210,duration:'16:32',color:'#FF8B3D'}
    ];

    layui.use(['layer'], function(){
        var $ = layui.$, layer = layui.layer;
        var currentCat = 1;

        function renderTabs(){
            var html='';
            $.each(MOCK_CATS,function(i,c){ html+='<div class="tab'+(c.id==currentCat?' active':'')+'" data-id="'+c.id+'">'+c.name+'</div>'; });
            $('#tabs').html(html);
        }
        function renderList(){
            var list = currentCat==1 ? MOCK_VIDEOS : MOCK_VIDEOS.filter(function(v){return v.cat==currentCat;});
            var html='';
            if(!list.length){ html='<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px;">暂无内容</div>'; }
            $.each(list,function(i,v){
                html+='<div class="video-item" data-id="'+v.id+'">'
                    +'<div class="video-cover" style="background:linear-gradient(135deg,'+v.color+',rgba(0,0,0,.2))">'
                    +'<span class="play-btn"><i class="layui-icon layui-icon-play"></i></span>'
                    +'<span class="duration">'+v.duration+'</span></div>'
                    +'<div class="video-body"><div class="video-title">'+v.title+'</div>'
                    +'<div class="video-meta"><span>'+v.views+' 次观看</span><span><i class="layui-icon layui-icon-right"></i></span></div></div></div>';
            });
            $('#list').html(html);
        }

        $(document).on('click','.tab',function(){ currentCat=$(this).data('id'); renderTabs(); renderList(); });
        $(document).on('click','.video-item',function(){
            layer.open({type:2, title:'视频详情', content:'/video/detail.html?id='+$(this).data('id'), area:['860px','82%']});
        });

        renderTabs(); renderList();
    });
</script>
</body>
</html>
