<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>儿童档案 - 新增/编辑</title>
    <link rel="stylesheet" href="/assets/layui/css/layui.css" media="all">
    <style>
        body { padding: 22px 26px; font-family: "Microsoft YaHei", Arial, sans-serif; }
        .layui-form-label { width: 110px; }
        .layui-input-block { margin-left: 140px; }
    </style>
<script src="/assets/demo-auth.js"></script>
</head>
<body>
    <form class="layui-form" lay-filter="baby-form">
        <input type="hidden" name="id" value="">

        <div class="layui-form-item">
            <label class="layui-form-label">姓名</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" placeholder="请输入儿童姓名" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">性别</label>
            <div class="layui-input-block">
                <input type="radio" name="sex" value="1" title="男" checked>
                <input type="radio" name="sex" value="0" title="女">
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">年龄</label>
                <div class="layui-input-inline" style="width:200px;">
                    <input type="number" name="age" placeholder="请输入年龄" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">出生日期</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="text" name="birthday" id="birthday" placeholder="请选择日期" class="layui-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">身高</label>
                <div class="layui-input-inline" style="width:200px;">
                    <input type="number" name="height" step="0.1" lay-verify="number" placeholder="单位：cm" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">体重</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="number" name="weight" step="0.1" lay-verify="number" placeholder="单位：kg" class="layui-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">手机号码</label>
            <div class="layui-input-block">
                <input type="text" name="mobile" lay-verify="phone" placeholder="请输入手机号码" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">父亲身高</label>
                <div class="layui-input-inline" style="width:200px;">
                    <input type="number" name="father_height" placeholder="单位：cm" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">母亲身高</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="number" name="mother_height" placeholder="单位：cm" class="layui-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">过敏史</label>
            <div class="layui-input-block">
                <textarea name="allergy" placeholder="请输入过敏史，如无请填写“无”" class="layui-textarea"></textarea>
            </div>
        </div>

        <div class="layui-form-item" style="display:none;">
            <button class="layui-btn" id="baby-edit-submit" lay-submit lay-filter="baby-edit-submit">确定</button>
        </div>
    </form>

    <script src="/assets/layui/layui.js"></script>
    <script>
        layui.use(['form','laydate'], function(){
            var form = layui.form, laydate = layui.laydate, $ = layui.$;
            // 显式使用 click 触发，避免 readonly/焦点问题导致点击无法弹出日历
            laydate.render({elem:'#birthday', trigger:'click'});

            // 编辑回显（mock）
            function getQueryParams(){
                var params = {};
                var search = location.search.replace(/^\?/, '');
                if(!search && location.hash.indexOf('?') > -1){ search = location.hash.split('?')[1]; }
                if(!search){ return params; }
                $.each(search.split('&'), function(i, item){
                    if(!item){ return; }
                    var pair = item.split('=');
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair.slice(1).join('=')).replace(/\+/g, ' ');
                });
                return params;
            }
            var params = getQueryParams();
            if(params.id){
                var MOCK = {
                    1:{name:'林小满',sex:1,age:5,birthday:'2021-03-15',height:108,weight:18.5,mobile:'13900139001',father_height:175,mother_height:163,allergy:'花生过敏'},
                    2:{name:'陈一诺',sex:0,age:4,birthday:'2022-07-08',height:104,weight:17.2,mobile:'13900139002',father_height:178,mother_height:165,allergy:'无'},
                    3:{name:'王梓涵',sex:1,age:6,birthday:'2020-11-22',height:120,weight:22.4,mobile:'13900139003',father_height:172,mother_height:160,allergy:'牛奶过敏'}
                };
                var row = MOCK[params.id];
                if(row){ form.val('baby-form', row); }
            }
            form.render();
        });
    </script>
</body>
</html>
