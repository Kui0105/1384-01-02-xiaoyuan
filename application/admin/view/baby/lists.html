<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index','table','like','laydate'], function(){
        var $ = layui.$
            ,form = layui.form
            ,table = layui.table
            ,laydate = layui.laydate
            ,like = layui.like;

        //图片放大
        $(document).on('click', '.image-show', function () {
            var src = $(this).attr('src');
            like.showImg(src,600);
        });
//日期时间范围
        laydate.render({
            elem: '#start_time'
            ,type: 'datetime'
            ,trigger: 'click'
        });

        //日期时间范围
        laydate.render({
            elem: '#end_time'
            ,type: 'datetime'
            ,trigger: 'click'
        });
        //监听搜索
        form.on('submit(article-search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('article-lists', {
                where: field,
                page: {
                    curr: 1 //重新从第 1 页开始
                },

            });
        });
        //监听重置
        form.on('submit(article-clear-search)', function(){
            $('#name').val('');
            $('#keyword').val('');
            $('#sex').val('');
            $('#start_time').val('');  //清空输入框
            $('#end_time').val('');  //清空输入框
            form.render('select');
            //刷新列表
            table.reload('article-lists', {
                where: [],
                page: {
                    curr: 1 //重新从第 1 页开始
                }
            });
        });

        // 导出
        // form.on('submit(export-file)', function (data) {
        //     var field = data.field;
        //     like.ajax({
        //         url: '{:url("baby/export_lists")}?user_id='+$('#user_id').val()
        //         , data: field
        //         , type: 'get'
        //         , success: function (res) {
        //             if (res.code == 1) {
        //                 window.location.href = res.data.url;
        //             }
        //         }
        //     });
        // });


        table.render({
            elem: '#article-lists'
            ,url: '{:url("baby/lists")}?user_id='+$('#user_id').val()
            ,cols: [[
                // {type: 'checkbox',title: '当页全选'}
                {field: 'id', title: 'ID',width:70,align: 'center'}
                ,{title: '用户信息',minWidth: 280,align: 'center', toolbar: '#user-info'}
                ,{field: 'img',width:120, title: '宝宝头像',toolbar: '#img'}
                ,{field: 'name', title: '姓名',width:120,align: 'center'}
                ,{field: 'sex_str', title:'性别',align: 'center',width:80}
                ,{field: 'birthday_str', title:'出生日期',align: 'center',width:120}
                ,{field: 'father_height', title:'父亲身高',align: 'center',width:100}
                ,{field: 'mother_height', title: '母亲身高',width:100,align: 'center'}
                ,{field: 'height', title: '当前身高',width:100,align: 'center'}
                ,{field: 'weight', title: '当前体重',width:100,align: 'center'}
                ,{field: 'sup_height', title: '期望身高',width:100,align: 'center'}
                ,{field: 'genetic_height', title: '遗传身高',width:100,align: 'center'}
                ,{field: 'predicting_height', title: '预测身高',width:100,align: 'center'}
                ,{field: 'bone', title: '骨龄',width:100,align: 'center'}
                ,{field: 'address', title: '城市',width:100,align: 'center'}

                ,{field: 'create_time', title: '添加时间',width:160,align: 'center'}
                ,{fixed: 'right', title: '操作', align: 'center', toolbar: '#article-operation',width:200}
            ]]
            ,page:true
            ,text: {none: '暂无数据！'}
            ,parseData: function(res){ //将原始数据解析成 table 组件所规定的数据
                return {
                    "code":res.code,
                    "msg":res.msg,
                    "count": res.data.count, //解析数据长度
                    "data": res.data.list, //解析数据列表
                };
            }
            ,done: function(res, curr, count){
                setTimeout(function () {
                    // 解决操作栏因为内容过多换行问题
                    $(".layui-table-fixed-l .layui-table-body").removeAttr("style");
                    $(".layui-table-fixed-r .layui-table-body").removeAttr("style");
                    $(".layui-table-main tr").each(function (index, val) {
                        console.log($(val).height());
                        $($(".layui-table-fixed-l .layui-table-body tbody tr")[index]).height($(val).height());
                        $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());
                    });
                }, 100)
            }
        });

        //监听工具条
        table.on('tool(article-lists)', function(obj){

            if(obj.event === 'history_height'){
                var id = obj.data.id;
                var name = obj.data.name;
                layer.open({
                    type: 2
                    ,title: '<span style="color:red;font-weight:bold">'+name+'</span>:身高记录'
                    ,content: '{:url("baby/history_check")}?type=1&id='+id
                    ,area: ['90%','90%']
                    ,btn: ['返回']
                    ,yes:function(index){
                        layer.close(index); //关闭弹层
                        table.reload('article-lists'); //数据刷新
                    }
                })
            }
            if(obj.event === 'history_log'){
                var id = obj.data.id;
                var name = obj.data.name;
                layer.open({
                    type: 2
                    ,title: '<span style="color:red;font-weight:bold">'+name+'</span>:测评日志'
                    ,content: '{:url("baby/history_log")}?id='+id
                    ,area: ['90%','90%']
                    ,btn: ['返回']
                    ,yes:function(index){
                        layer.close(index); //关闭弹层
                        table.reload('article-lists'); //数据刷新
                    }
                })
            }

        });
    });



</script>
