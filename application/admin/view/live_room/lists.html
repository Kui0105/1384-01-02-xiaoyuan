{layout name="layout1" /}
<style>
    .layui-table-cell {
        height: auto;
        white-space: normal;
    }
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-collapse like-layui-collapse">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title like-layui-colla-title">操作提示</h2>
                    <div class="layui-colla-content layui-show">
                        <p>*仅可更改标题、封面、创建人（前端展示效果）</p>
                        <p>*扫此二维码开播：<img class="image-show" src="/static/admin/images/zhibo.png" alt="zb" style="width:50px;height:50px;"> </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-card-body">

            <table id="like-table-lists" lay-filter="like-table-lists"></table>

            <script type="text/html" id="image">
                <img src="{{d.image}}" style="height:auto;width: auto" class="image-show">
            </script>

            <script type="text/html" id="headUrl">
                <img src="{{d.headUrl}}" style="height:auto;width: auto" class="image-show">
            </script>
            <script type="text/html" id="operation">
                <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="edit">编辑</a>
            </script>
        </div>
    </div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/'
    }).extend({
        index: 'lib/index'
    }).use(['index','table','like','laydate'], function(){
        var $ = layui.$
            ,table = layui.table
            ,like = layui.like;

        $(document).on('click', '.image-show', function () {
            var src = $(this).attr('src');
            like.showImg(src,600);
        });

        //管理员管理
        table.render({
            id: 'like-table-lists'
            ,elem: '#like-table-lists'
            ,url: '{:url("LiveRoom/lists")}'
            ,cols: [[
                {field:'id', width: 80, title: 'ID', sort: true, hide:true}
                ,{field:'name', title:'标题',width:200}
                ,{field:'user_name', title:'主播昵称', width:100, align:'center'}
                ,{field: 'image', title: '封面',toolbar: '#image',width:150}
                ,{field:'description', title:'简介', width:200, align:'center'}
                ,{field:'feedId', title:'feedId', width:100, align:'center'}
                ,{field:'nonceId', title:'nonceId', width:100, align:'center'}
                ,{field:'nickname', title:'视频号昵称', width:100, align:'center'}
                ,{field: 'headUrl', title: '视频号头像',toolbar: '#headUrl',width:150}
                ,{field:'update_time', title:'更新时间', width:200, align:'center'}
                ,{field:'status_text', title:'状态', width:100, align:'center'}
                ,{fixed:'right', title:'操作', width:150, align:'center', toolbar:'#operation'}

            ]]
            ,page:true
            ,text: {none: '暂无数据！'}
            ,parseData: function(res){
                return {
                    "code":res.code,
                    "msg":res.msg,
                    "count": res.data.count,
                    "data": res.data.lists
                };
            }
            ,done: function fix() {
                $(".layui-table-main tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-body tbody tr")[index]).height($(val).height());
                    });
                });
                $(".layui-table-header tr").each(function (index, val) {
                    $(".layui-table-fixed").each(function () {
                        $($(this).find(".layui-table-header thead tr")[index]).height($(val).height());
                    });
                });
                window.onresize = function () {
                    fix()
                }
            }
        });

        //事件
        var active = {
            add: function(){
                layer.open({
                    type: 2
                    ,title: '创建直播间'
                    ,content: '{:url("LiveRoom/add")}'
                    ,area: ['90%','90%']
                    ,btn: ['确定', '取消']
                    ,yes: function(index, layero){
                        var iframeWindow = window['layui-layer-iframe'+ index]
                            ,submitID = 'addSubmit'
                            ,submit = layero.find('iframe').contents().find('#'+ submitID);
                        iframeWindow.layui.form.on('submit('+ submitID +')', function(data){
                            var field = data.field;
                            console.log(field);
                            like.ajax({
                                url:'{:url("LiveRoom/add")}',
                                data:field,
                                type:"post",
                                success:function(res) {
                                    if(res.code === 1) {
                                        layui.layer.msg(res.msg, { offset:'15px', icon:1, time:1000 });
                                        layer.close(index);
                                        table.reload('like-table-lists');
                                    }
                                }
                            });
                        });
                        submit.trigger('click');
                    }
                });
            },
            // 同步直播间
            sync: function(){
                table.reload('like-table-lists');
            },
            // 删除
            del: function (obj) {
                layer.confirm('确定要删除直播间:'+obj.data.name, function(index) {
                    like.ajax({
                        url: '{:url("LiveRoom/del")}',
                        data: {id:obj.data.roomid},
                        type: "post",
                        success: function (res) {
                            if (res.code === 1) {
                                layui.layer.msg(res.msg, {offset: '15px', icon: 1, time: 1000});
                                layer.close(index);
                                obj.del();
                            }
                        }
                    });
                    layer.close(index);
                })
            },
            edit: function(obj){
                var id = obj.data.id;
                layer.open({
                    type: 2
                    ,title: '编辑直播'
                    ,content: '{:url("LiveRoom/edit")}?id='+id
                    ,area: ['60%','90%']
                    ,btn: ['确定', '取消']
                    ,yes: function(index, layero){
                        var iframeWindow = window['layui-layer-iframe'+ index]
                            ,submitID = 'edit-live-submit'
                            ,submit = layero.find('iframe').contents().find('#'+ submitID);

                        //监听提交
                        iframeWindow.layui.form.on('submit('+ submitID +')', function(data){
                            var field = data.field;
                            like.ajax({
                                url:'{:url("LiveRoom/edit")}',
                                data:field,
                                type:"post",
                                success:function(res)
                                {
                                    if(res.code == 1)
                                    {
                                        layui.layer.msg(res.msg, {
                                            offset: '15px'
                                            , icon: 1
                                            , time: 1000
                                        });
                                        layer.close(index);
                                        table.reload('like-table-lists');
                                    }
                                }
                            });
                        });
                        submit.trigger('click');
                    }
                })
            }
        };

        // 监听表格右侧工具条
        table.on('tool(like-table-lists)', function(obj){
            var type = obj.event;
            active[type] ? active[type].call(this, obj) : '';
        });

        // 绑定点击按钮事件
        $('.layui-btn.layuiadmin-btn').on('click', function(){
            var type = $(this).data('type');
            active[type] ? active[type].call(this) : '';
        });


    });
</script>
