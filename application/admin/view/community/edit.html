{layout name="layout2" /}
<style>
    .layui-form-label {
        color: #6a6f6c;
    }
    .goods-li {
        float: left;
        opacity: 1;
        position: relative;
    }

    .goods-img {
        width: 80px;
        height: 80px;
        padding: 4px;
    }
    .goods-img-del-x {
        position: absolute;
        z-index: 100;
        top: -4px;
        right: -2px;
        width: 20px;
        height: 20px;
        font-size: 16px;
        line-height: 16px;
        color: #fff;
        text-align: center;
        cursor: pointer;
        background: hsla(0, 0%, 60%, .6);
        border-radius: 10px;
    }

    #image{
        left:110px;
    }
    #notice{ left:110px;}
</style>
<div class="layui-form" lay-filter="layuiadmin-form-category" id="layuiadmin-form-category" style="padding: 20px 30px 0 0;">
    <input type="hidden" value="{$article.id}" name="id">

    <div class="layui-form-item">
        <label class="layui-form-label"><font color="red">*</font>标题</label>
        <div class="layui-input-block">
            <input type="text" name="name" value="{$article.name}" lay-verify="required"   lay-verType="tips"  placeholder="请输入标题" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item type_article" >
        <label class="layui-form-label">内容</label>
        <div class="layui-input-block">
            <textarea  name="content" id="content" lay-verify="content"  style="width: 400px; height: 380px;" class="layui-textarea">{$article.content}</textarea>
        </div>
    </div>

    <div class="layui-form-item" style="margin-bottom: 0px">
        <label class="layui-form-label">图片</label>
        <div class="" style="height:80px;line-height:80px">
            <ul>
                {if !empty($article.imgs)}
                {foreach $article.imgs as $val}
                <li class="goods-li">
                    <input name="imgs[]" type="hidden" value="{$val}">
                    <img class="goods-img goods_image" src="{$val}">
                    <a class="goods-img-del-x" style="display: none;">x</a>
                </li>
                {/foreach}
                {/if}
            </ul>
            <div class="goods-img-add" lay-verify="other_qualifications"></div>
            <br>
            <br>
        </div>
    </div>




    <div class="layui-form-item layui-hide">
    <input type="button" lay-submit lay-filter="edit-article-submit" id="edit-article-submit" value="确认">
</div>
</div>
<script type="text/html" id="template-goods-image">
    <li class="goods-li">
        <input name="imgs[]" type="hidden" value="{image-src}">
        <img class="goods-img goods_image" src="{image-src}">
        <a class="goods-img-del-x" style="display: none;">x</a></li>
</script>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','likeedit','like'], function(){
        var $ = layui.$
            ,form = layui.form
            ,like = layui.like

        //上传图片
        like.imageUpload('.goods-img-add', function (uris, element) {
            var count = element.prev().children().length;

            count = !count ? 0:count;
            if (count+uris.length > 8) {
                layer.msg('最多最能选中8张图片');
                return;
            }
            uris = uris.reverse();
            for(var i in uris){
                var uri = uris[i];
                var template_goods_image = $('#template-goods-image').html();
                element.prev().append(template_goods_image.replace('{image-src}', like.getUrlFileName(uri, '{$storageUrl}')).replace('{image-src}', uri));
            }
        }, true);
        //删除图片
        $(document).on('click', '.goods-img-del-x', function () {
            $(this).parent().siblings('input').val('');
            $(this).parent().prev().css('display','block');
            $(this).parent().remove();
        });
        //显示图片
        $(document).on('click', '.goods-img', function () {
            var image = $(this).attr('src');
            like.showImg(image,600);
        });

        //  删除按钮的显示与隐藏
        $(document).on('mouseover', '.goods-img', function () {
            $(this).next().show();
        });
        $(document).on('mouseout', '.goods-img', function () {
            $(this).next().hide();
        });
        $(document).on('mouseover', '.goods-img-del-x', function () {
            $(this).show();
        });
        $(document).on('mouseout', '.goods-img-del-x', function () {
            $(this).hide();
        });

    });
</script>
