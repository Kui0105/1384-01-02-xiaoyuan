<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index','table','like'], function(){
        var $ = layui.$
            ,form = layui.form
            ,table = layui.table
            ,like = layui.like;

        //图片放大
        $(document).on('click', '.image-show', function () {
            var src = $(this).attr('src');
            like.showImg(src,600);
        });
        //监听搜索
        form.on('submit(article-search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('article-lists', {
                where: field,
                page: {
                    curr: 1 //重新从第 1 页开始
                },

            });
        });
        //监听重置
        form.on('submit(article-clear-search)', function(){
            $('#title').val('');
            $('#cid').val('');
            $('#status').val('');
            $('#user_name').val('');
            form.render('select');
            //刷新列表
            table.reload('article-lists', {
                where: [],
                page: {
                    curr: 1 //重新从第 1 页开始
                }
            });
        });


        //事件
        var active = {
            batchdel:function(){ //删除所选
                var checkStatus = table.checkStatus('article-lists')
                    ,checkData = checkStatus.data; //得到选中的数据
                //是否已选数据
                if(checkData.length === 0){
                    return layer.msg('请选择数据');
                }else {
                    //获取所选id
                    ids = [];
                    for (var i in checkData){
                        ids.push(checkData[i]['id']);
                    }

                    layer.confirm('确定删除所选评论信息？', function(index){
                        like.ajax({
                            url:'{:url("community/del_comment")}',
                            data:{id:ids},
                            type:"post",
                            success:function(res)
                            {
                                if(res.code == 1)
                                {
                                    layui.layer.msg(res.msg, {
                                        offset: '15px'
                                        , icon: 1
                                        , time: 1000
                                    });
                                    layer.close(index); //关闭弹层
                                    table.reload('article-lists'); //数据刷新
                                }
                            }
                        });
                        layer.close(index);
                    });
                }
            }
        };
        $('.layui-btn.layuiadmin-btn-article').on('click', function(){
            var type = $(this).data('type');
            active[type] ? active[type].call(this) : '';
        });


        table.render({
            elem: '#article-lists'
            ,url: "{:url('Community/comment_lists')}?id={$_GET['id']}"
            ,cols: [[
                // {type: 'checkbox',title: '当页全选'}
                {field: 'user', title: '评论人', templet:'#user',width:300}
                ,{field: 'name', title: '@信息',templet:'#ruser',width:300}
                ,{field: 'content', title: '内容',width:150}
                ,{field: 'create_time', title: '评论时间',width:160}
                ,{fixed: 'right', title: '操作', align: 'center', toolbar: '#article-operation',width:250}
            ]]
            ,page:true
            ,text: {none: '暂无数据！'}
            ,parseData: function(res){ //将原始数据解析成 table 组件所规定的数据
                return {
                    "code":res.code,
                    "msg":res.msg,
                    "count": res.data.count, //解析数据长度
                    "data": res.data.lists, //解析数据列表
                };
            }
            ,done: function(res, curr, count){
                setTimeout(function () {
                    // 解决操作栏因为内容过多换行问题
                    $(".layui-table-fixed-l .layui-table-body").removeAttr("style");
                    $(".layui-table-fixed-r .layui-table-body").removeAttr("style");
                    $(".layui-table-main tr").each(function (index, val) {
                        console.log($(val).height());
                        $($(".layui-table-fixed-l .layui-table-body tbody tr")[index]).height($(val).height());
                        $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());
                    });
                }, 100)
            }
        });

        //监听工具条
        table.on('tool(article-lists)', function(obj){
            if(obj.event === 'del'){
                var id = obj.data.id;
                var title = obj.data.content;
                layer.confirm('确定要删除评论：'+'<span style="color: red">'+title+'</span>', function(index){
                    like.ajax({
                        url:'{:url("community/del_comment")}',
                        data:{'id':id},
                        type:"post",
                        success:function(res)
                        {
                            if(res.code == 1)
                            {
                                layui.layer.msg(res.msg, {
                                    offset: '15px'
                                    , icon: 1
                                    , time: 1000
                                });
                                layer.close(index);
                                table.reload('article-lists');
                            }
                        }
                    });
                });
            }
        });
    });



</script>
