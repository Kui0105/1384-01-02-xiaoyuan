{layout name="layout2" /}
<style>
    .layui-form-label {
        color: #6a6f6c !important;
    }
</style>
<div class="layui-card layui-form" style="box-shadow:none;">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">审核结果</label>
            <div class="layui-input-block">
                <input type="radio" name="audit_status" value="1" title="审核通过">
                <input type="radio" name="audit_status" value="2" title="审核拒绝" checked>
            </div>
            <div class="layui-form-mid layui-word-aux">审核通过即可成为等级会员</div>
        </div>
        {foreach $radio_data as $radio}
        <div class="layui-form-item">
            <label class="layui-form-label" >抽成比例%</label>
            <div class="layui-input-inline">
                <input type="number" value="{$radio.point}" name="{$radio.id}"  placeholder="请输入" class="layui-input" min="0">
            </div>
            <div class="layui-form-mid layui-word-aux">{$radio.name}</div>
        </div>
        {/foreach}
        <div class="layui-form-item layui-form-text">
            <label for="reason" class="layui-form-label">审核说明</label>
            <div class="layui-input-block">
                <textarea name="reason" id="reason" placeholder="请输入内容" class="layui-textarea"></textarea>
            </div>
        </div>

        <div class="layui-form-item layui-hide">
            <input type="button" lay-submit lay-filter="addSubmit" id="addSubmit" value="确认">
        </div>
    </div>
</div>

<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/modules/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(["table", "form", "element", "laydate", 'like'], function() {
        var form = layui.form;
        var like = layui.like;

    });
</script>
