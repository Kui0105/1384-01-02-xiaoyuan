{layout name="layout2" /}
<style>
    html,
    body {
        background: #f8f8f8;
    }
    .layui-panel {
        margin: 5px;
    }
    .layui-form-label {
        width: 120px;
        text-align: left;
        padding-left:30px;
        color: #6a6f6c !important;
    }
    .layui-form {
        padding: 15px;
        background: #f8f8f8;
    }


    .goods-li {
        float: left;
        opacity: 1;
        position: relative;
    }
    .goods-img {
        width: 80px;
        height: 80px;
        padding: 4px;
    }
    .goods-img-del-x {
        position: absolute;
        z-index: 100;
        top: -4px;
        right: -2px;
        width: 20px;
        height: 20px;
        font-size: 16px;
        line-height: 16px;
        color: #fff;
        text-align: center;
        cursor: pointer;
        background: hsla(0, 0%, 60%, .6);
        border-radius: 10px;
    }
</style>
<!-- 表单 -->
<form class="layui-form">
    <div class="layui-card">
        <div class="layui-card-header">结算设置</div>
        <div class="layui-card-body">
            <div class="layui-form-item">
                <label class="layui-form-label">佣金计算方式</label>
                <div class="layui-input-block">
                    <input type="radio" name="cale_method" value="1" title="商品实际支付金额" {if $config.cale_method == 1}checked{/if}>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label"></label>
                <div class="layui-input-block layui-word-aux">
                    根据商品实际支付金额及相应的佣金比例计算佣金
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">结算时机</label>
                <div class="layui-inline">
                    <input type="radio" name="settlement" value="1" title="订单完成后" {if $config.settlement == 1}checked{/if}>
                </div>
                <div class="layui-inline">
                    <input type="number" min="0" name="settlement_days" value="{$config.settlement_days}" class="layui-input" />
                </div>
                <div class="layui-inline">
                    天
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label"></label>
                <div class="layui-input-block layui-word-aux">
                    预估佣金结算后无法进行回收，请谨慎设置结算天数
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">省代抽成</label>
                <div class="layui-inline">
                    <input type="number" min="0" name="province_point" value="{$config.province_point}" class="layui-input" />
                </div>
                <div class="layui-inline">
                    %
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">市代抽成</label>
                <div class="layui-inline">
                    <input type="number" min="0" name="city_point" value="{$config.city_point}" class="layui-input" />
                </div>
                <div class="layui-inline">
                    %
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">区代抽成</label>
                <div class="layui-inline">
                    <input type="number" min="0" name="area_point" value="{$config.area_point}" class="layui-input" />
                </div>
                <div class="layui-inline">
                    %
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">诊所抽成</label>
                <div class="layui-inline">
                    <input type="number" min="0" name="hospital_point" value="{$config.hospital_point}" class="layui-input" />
                </div>
                <div class="layui-inline">
                    %
                </div>
            </div>

            <!-- 自定义分销海报图 -->
            <div class="layui-form-item" style="margin-bottom:0;">
                <label class="layui-form-label">分销海报图：</label>
                <div class="layui-input-inline">
                    <div class="" style="height:120px;line-height:120px;">
                        <input name="share_poster" type="hidden" value="{$config.share_poster}" >
                        {if !empty($config.share_poster)}
                        <div class="goods-img-add" style="display: none"></div>
                        <div class="goods-li">
                            <img class="goods-img" style="width: auto;height: 120px" src="{$config.share_poster}">
                            <a class="goods-img-del-x" style="display: none">x</a>
                        </div>
                        {else}
                        <div class="goods-img-add"></div>
                        {/if}
                    </div>
                    <div class=" layui-form-mid layui-word-aux" style="white-space: nowrap">自定义分销推广海报图片，建议尺寸：900*1225像素.背景图下方请留白用于放置会员信息</div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label"></label>
                <div class="layui-input-block">
                    <button class="layui-btn layui-bg-blue layui-btn layui-btn-sm" lay-submit lay-filter="*">保存设置</button>
                </div>
            </div>
        </div>
    </div>
</form>

<script>

    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/modules/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['element', 'form', 'like'], function () {
        var $ = layui.$
            , form = layui.form
            , like = layui.like
            , layer = layui.layer;

        form.on('submit(*)', function (data) {
            like.ajax({
                url: '{:url("distribution_setting/set")}'
                , data: data.field
                , type: 'post'
                , success: function (res) {
                    if (res.code == 1) {
                        layer.msg(res.msg);
                    }
                },
            });
            return false; //阻止表单跳转
        });

        //上传图片
        like.imageUpload('.goods-img-add', function (uri, element) {
            var html = '<div class="goods-li">\n' +
                '<img class="goods-img" ' +
                'src="' + uri[0] + '">' +
                '<a class="goods-img-del-x" style="display: none">x</a>' +
                '</div>';
            element.prev().val(like.getUrlFileName(uri[0], '{$storageUrl}'));
            element.parent().append(html);
            element.css('display','none');
        }, true);

        //删除图片
        $(document).on('click', '.goods-img-del-x', function () {
            $(this).parent().siblings('input').val('');
            $(this).parent().prev().css('display','block');
            $(this).parent().remove();
        });
        //显示图片
        $(document).on('click', '.goods-img', function () {
            var image = $(this).attr('src');
            like.showImg(image,400);
        });
        //  删除按钮的显示与隐藏
        $(document).on('mouseover', '.goods-img', function () {
            $(this).next().show();
        });
        $(document).on('mouseout', '.goods-img', function () {
            $(this).next().hide();
        });
        $(document).on('mouseover', '.goods-img-del-x', function () {
            $(this).show();
        });
        $(document).on('mouseout', '.goods-img-del-x', function () {
            $(this).hide();
        });

    });
</script>
