{layout name="layout2" /}

<div class="layui-form" lay-filter="layuiadmin-form-user" id="layuiadmin-form-user" style="padding: 20px 30px 0 0;">

    <div class="layui-form-item">
        <label class="layui-form-label">用户昵称：</label>
        <div class="layui-input-inline" id="layerDemo" style="width: 50%">
            <input type="hidden" id="user_id" name="user_id" value="">
            <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" style="height: 50px;padding: 0 20px;display: block;" data-method="addUser"><i class="layui-icon" style="font-size: 25px!important;" id="user_name">+</i></button>
<!--            <div class=" layui-form-mid layui-word-aux" >选择商城用户</div>-->
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">姓名：</label>
        <div class="layui-input-inline">
            <input type="text" name="name" value="" lay-verify="" lay-vertype="tips" placeholder="" autocomplete="off" class="layui-input">

        </div>
<!--        <label class="layui-form-mid layui-word-aux">用户无等级时必填，有等级时为同步更新</label>-->
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">电话：</label>
        <div class="layui-input-inline">
            <input type="text" name="mobile" value="" lay-verify="" lay-vertype="tips" placeholder="" autocomplete="off" class="layui-input">

        </div>
<!--        <label class="layui-form-mid layui-word-aux">用户无等级时必填，有等级时为同步更新</label>-->
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">选择省代：</label>
        <div class="layui-inline">
            <div class="layui-input-inline">
                <select id="level" name="level"   style="height:80px;width: 80px" >
                    {foreach $area_list as $item}
                    <option value="{$item.id}">{$item.name}</option>
                    {/foreach}
                </select>
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">抽成比例：</label>
        <div class="layui-input-inline">
            <input type="number" name="money" value="{$point}" lay-verify="" lay-vertype="tips" placeholder="" autocomplete="off" class="layui-input">
            <label class="layui-form-mid layui-word-aux">请输入0-100（%）</label>
        </div>
        <label class="layui-form-mid">%</label>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">备注:</label>
        <div class="layui-input-block">
            <textarea type="text" name="remark"  autocomplete="off" class="layui-textarea"></textarea>
            <label class="layui-form-mid layui-word-aux">不超过100字</label>
        </div>
    </div>

    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="adjust_province-submit" id="adjust_province-submit" value="确认">
    </div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','like_area'], function(){
        var $ = layui.$
            ,like_area = layui.like_area
            ,form = layui.form ;

        // 触发事件
        var active = {
            addUser: function(obj){
                layer.open({
                    type: 2
                    ,title: '用户列表'
                    ,content: '{:url("selffetch_verifier/userLists")}'
                    ,area: ['90%','90%']
                    ,btn: ['确定', '取消']
                    ,yes: function(index, layero){
                        layer.closeAll();
                    }
                    ,btn2: function(index, layero){
                        $('#user_id').val(user_id);
                        $('#user_name').html(user_name);
                    }
                });
            }
        };
        $('#layerDemo .layui-btn').on('click', function(){
            var othis = $(this), method = othis.data('method');
            active[method] ? active[method].call(this, othis) : '';
        });

    })
</script>
