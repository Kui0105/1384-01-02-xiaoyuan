                <a class="layui-btn layui-btn-sm layui-bg-blue" lay-event="adjust">修改</a>
                <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del">移除</a>

<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index','table','like','laydate'], function(){
        var $ = layui.$
            ,form = layui.form
            ,table = layui.table
            ,laydate = layui.laydate
            ,like = layui.like;

        //图片放大
        $(document).on('click', '.image-show', function () {
            var src = $(this).attr('src');
            like.showImg(src,600);
        });
//日期时间范围
        laydate.render({
            elem: '#start_time'
            ,type: 'datetime'
            ,trigger: 'click'
        });

        //日期时间范围
        laydate.render({
            elem: '#end_time'
            ,type: 'datetime'
            ,trigger: 'click'
        });
        //监听搜索
        form.on('submit(article-search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('lists', {
                where: field,
                page: {
                    curr: 1 //重新从第 1 页开始
                },

            });
        });
        //监听重置
        form.on('submit(article-clear-search)', function(){
            $('#name').val('');
            $('#keyword').val('');
            $('#sex').val('');
            $('#start_time').val('');  //清空输入框
            $('#end_time').val('');  //清空输入框
            form.render('select');
            //刷新列表
            table.reload('lists', {
                where: [],
                page: {
                    curr: 1 //重新从第 1 页开始
                }
            });
        });

        // 导出
        // form.on('submit(export-file)', function (data) {
        //     var field = data.field;
        //     like.ajax({
        //         url: '{:url("baby/export_lists")}?user_id='+$('#user_id').val()
        //         , data: field
        //         , type: 'get'
        //         , success: function (res) {
        //             if (res.code == 1) {
        //                 window.location.href = res.data.url;
        //             }
        //         }
        //     });
        // });


        table.render({
            elem: '#lists'
            ,url: '{:url("distribution_member/doctor")}?hos_id='+$('#hos_id').val()
            ,cols: [[
                // {type: 'checkbox',title: '当页全选'}
                {field: 'id', title: 'ID',width:70,align: 'center'}
                ,{field: 'name',minWidth: 280,align: 'center', title: '医生名称'}
                ,{field: 'imgs',width:120, title: '医生照片',toolbar: '#img'}
                ,{field: 'create_time', title: '添加时间',width:160,align: 'center'}
                ,{fixed: 'right', title: '操作', align: 'center', toolbar: '#article-operation',width:200}
            ]]
            ,page:true
            ,text: {none: '暂无数据！'}
            ,parseData: function(res){ //将原始数据解析成 table 组件所规定的数据
                return {
                    "code":res.code,
                    "msg":res.msg,
                    "count": res.data.count, //解析数据长度
                    "data": res.data.list, //解析数据列表
                };
            }
            ,done: function(res, curr, count){
                setTimeout(function () {
                    // 解决操作栏因为内容过多换行问题
                    $(".layui-table-fixed-l .layui-table-body").removeAttr("style");
                    $(".layui-table-fixed-r .layui-table-body").removeAttr("style");
                    $(".layui-table-main tr").each(function (index, val) {
                        console.log($(val).height());
                        $($(".layui-table-fixed-l .layui-table-body tbody tr")[index]).height($(val).height());
                        $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());
                    });
                }, 100)
            }
        });

        // 功能按钮
        $('#open').click(function() { // 开通分销会员
            layer.open({
                type: 2
                ,title: "添加医生"
                ,content: "{:url('distribution_member/add_doctor')}?hos_id="+{$hos_id}
                ,area: ["90%", "90%"]
                ,btn: ["确定", "取消"]
                ,yes: function(index, layero){
                    var iframeWindow = window['layui-layer-iframe'+ index]
                        ,submit = layero.find('iframe').contents().find('#add_doctor-submit');
                    //监听提交
                    iframeWindow.layui.form.on('submit(add_doctor-submit)', function(data){
                        var field = data.field;
                        $.ajax({
                            url:'{:url("distribution_member/add_doctor")}?hos_id='+{$hos_id},
                            data:field,
                            type:"post",
                            success:function(res)
                            {
                                if(res.code == 1)
                                {
                                    layui.layer.msg(res.msg, {
                                        offset: '15px'
                                        , icon: 1
                                        , time: 1000
                                    });
                                    layer.close(index); //关闭弹层
                                    table.reload('lists'); //数据刷新
                                }else{
                                    layer.msg(res.msg, {
                                        offset: '15px'
                                        , icon: 2
                                        , time: 1000
                                    });
                                }
                            }
                        });
                    });
                    submit.trigger('click');
                }
            });
        });

        //监听工具条
        table.on('tool(lists)', function(obj){

            var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
            if(layEvent === 'del'){ // 移除
                layer.confirm('确定要删除医生吗?', function(index){
                    layer.close(index);
                    like.ajax({
                        url: "{:url('distribution_member/del_doctor')}",
                        data: {id: obj.data.id},
                        type: "post",
                        success:function(res) {
                            if(res.code === 1) {
                                layui.layer.msg(res.msg);
                                layer.close(index);
                                table.reload("lists");
                            }
                        }
                    });
                });
            }else if(layEvent === 'adjust'){ // 分销等级调整
                id = obj.data.id;
                layer.open({
                    type: 2
                    ,title: "编辑医生"
                    ,content: "{:url('distribution_member/edit_doctor')}?id=" + id
                    ,area: ["90%", "90%"]
                    ,btn: ["确定", "取消"]
                    ,yes: function(index, layero){
                        var iframeWindow = window["layui-layer-iframe" + index];
                        var submit = layero.find("iframe").contents().find("#edit_doctor-submit");
                        iframeWindow.layui.form.on("submit(edit_doctor-submit)", function(data){
                            like.ajax({
                                url: "{:url('distribution_member/edit_doctor')}",
                                data: data.field,
                                type: "post",
                                success:function(res) {
                                    if(res.code === 1) {
                                        layui.layer.msg(res.msg);
                                        layer.close(index);
                                        table.reload("lists");
                                    }
                                }
                            });
                            return false;
                        });
                        submit.trigger("click");
                    }
                });
            }

        });
    });



</script>
