{layout name="layout2" /}
<style>
    .img-content{
        height:80px;
        line-height:80px
    }
    .img-container {
        float: left;
        opacity: 1;
        position: relative;
    }

    .img-src {
        width: 80px;
        height: 80px;
        padding: 4px;
    }
    .img-del-x {
        position: absolute;
        z-index: 100;
        top: -4px;
        right: -2px;
        width: 20px;
        height: 20px;
        font-size: 16px;
        line-height: 16px;
        color: #fff;
        text-align: center;
        cursor: pointer;
        background: hsla(0, 0%, 60%, .6);
        border-radius: 10px;
    }
</style>
<div class="layui-form" lay-filter="layuiadmin-form-user" id="layuiadmin-form-user" style="padding: 20px 30px 0 0;">
    <input type="hidden" name="id" value="{$info.id}">
    <input type="hidden" name="hos_id" value="{$info.hos_id}">
    <div class="layui-form-item">
        <label class="layui-form-label">门店名称：</label>
        <div class="layui-input-inline">
            <input class="layui-input" value="{$info.name}" name="name" type="text" placeholder="请输入门店名称" >
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">顶部图：</label>
        <div class="layui-input-block">
            <div class="img-content">
                <input name="imgs" type="hidden" value="{$info.imgs}">
                <div class="img-add"  {if $info.imgs } style="display: none" {/if} ></div>
            {if !empty($info.imgs)}
            <div class="img-container">
                <img class="img-src" src="{$info.imgs}">
                <a class="img-del-x">x</a>
            </div>
            {/if}
        </div>
    </div>
</div>
<div class="layui-form-item">
    <label class="layui-form-label">门店介绍</label>
    <div class="layui-input-block">
        <textarea name="intro" lay-verify="required" autocomplete="off" class="layui-textarea" style="height: 200px;">{$info.intro}</textarea>
    </div>
</div>

<div class="layui-form-item layui-hide">
    <input type="button" lay-submit lay-filter="hos_info-submit"  id="hos_info-submit" value="确认">
</div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','laydate','like'], function(){
        var $ = layui.$
            ,form = layui.form
            ,laydate = layui.laydate
            ,like = layui.like;
        laydate.render({
            elem: '#birthday'
            ,format: 'yyyy-MM-dd'
            ,trigger: 'click'
        });
        like.imageUpload('.img-add', function (uris, element) {
            if(uris.length>1){
                layer.msg('最多最能选中1张图片');
                return;
            }
            var html = '<div class="img-container">\n' +
                '<img class="img-src" ' +
                'src="' + uris[0] + '">' +
                '<a class="img-del-x">x</a>' +
                '</div>';
            element.prev().val(like.getUrlFileName(uris[0], '{$storageUrl}'));
            element.parent().append(html);
            element.css('display','none');
        }, true);
        //删除图片
        $(document).on('click', '.img-del-x', function () {
            $(this).parent().siblings('input').val('');
            $(this).parent().prev().css('display','block');
            $(this).parent().remove();
        });
        //显示图片
        $(document).on('click', '.img-src', function () {
            var image = $(this).attr('src');
            like.showImg(image, 600);
        });

        form.on('select(category)', function(data){
            var level = $(data.elem).find("option:selected").attr("data-level");
            $('.alliance_ratio').hide();
            $('.autotrophy_ratio').hide();
            if(level == 2){
                $('.alliance_ratio').show();
                $('.autotrophy_ratio').show();

            }
        });

    })
</script>
