{layout name="layout2" /}
<style>
    .map-container {
        width: 600px;
        height: 400px;
        margin-left:100px;
        margin-top:20px;
    }
    .layui-form-select dl {
        z-index: 1001;
    }
</style>

<div class="layui-form" lay-filter="layuiadmin-form-user" id="layuiadmin-form-user" style="padding: 20px 30px 0 0;">
    <input type="hidden" value="{$info.id}" name="id">
    <div class="layui-form-item">
        <label class="layui-form-label"><span class="form-label-asterisk">*</span>用户昵称：</label>
        <div class="layui-input-block" style="width: 50%;">
            <div style="display: flex;">
                <div style="border-radius: 50%;border: 1px solid #d2d2d2;overflow: hidden;"><img src="{$info.avatar}" style="width: 80px;height: 80px;"></div>
                <div style="padding-left: 10px;font-size: 18px;line-height: 40px;">
                    <p>{$info.mobile}</p>
                    <p>{$info.nickname}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">所属地区：</label>
        <input type="hidden" value="{$info.province}" id="default_province">
        <input type="hidden" value="{$info.city}" id="default_city">
        <input type="hidden" value="{$info.district}" id="default_district">
        <div class="layui-input-inline">
            <select name="province" id="province" lay-filter="province" lay-verify="required"
                    lay-verType="tips" switch-tab="0">
            </select>
        </div>
        <div class="layui-input-inline">
            <select name="city" id="city" lay-filter="city" lay-verify="required">
            </select>
        </div>
        <div class="layui-input-inline">
            <select name="district" id="district" lay-filter="district" lay-verify="required">
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">详细地址：</label>
        <div class="layui-input-inline">
            <input type="text" name="address" lay-verify="required" lay-verType="tips"  placeholder="" autocomplete="off" class="layui-input" value="{$info.address}">
        </div>
        <div class="layui-input-inline">
            <button class="layui-btn layui-btn-normal" id="search_map">搜索地图</button>
        </div>
    </div>
    <div class="layui-form-item" style="display:none;">
        <div class="layui-input-inline " id ='position_id' style="width: 800px;">
            <label class="layui-form-label" style="right:10px">地图坐标:</label>
            <div class="layui-input-inline" style="width:200px;">
                <input type="text" name="longitude" value="{$info.longitude}" class="layui-input">
            </div>
            <div class=" layui-form-mid">经度</div>
            <div class="layui-input-inline" style="width:200px;">
                <input type="text" name="latitude" value="{$info.latitude}" class="layui-input">
            </div>
            <div class=" layui-form-mid">纬度</div>
        </div>
    </div>
    <div class="layui-form-item ">
        <label class="layui-form-label">地图定位：</label>
        <div class="layui-input-block" style="margin-left:10px;">
            <div id="map-container" style="width: 700px;height: 400px;margin-left: 120px;"></div>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">抽成比例：</label>
        <div class="layui-input-inline">
            <input type="number" name="money" value="{$info.radio}" lay-verify="required" lay-vertype="tips" placeholder="" autocomplete="off" class="layui-input">
            <label class="layui-form-mid layui-word-aux">请输入0-100（%）</label>
        </div>
        <label class="layui-form-mid">%</label>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">备注:</label>
        <div class="layui-input-block">
            <textarea type="text" name="remark" lay-verify="required" autocomplete="off" class="layui-textarea"></textarea>
            <label class="layui-form-mid layui-word-aux">不超过100字</label>
        </div>
    </div>

    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="edit_hos-submit" id="edit_hos-submit" value="确认">
    </div>
</div>
<script src="https://map.qq.com/api/gljs?v=1.exp&key={$tx_map_key}&libraries=service"></script>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','like','like_area', 'txMap','customTxMap'], function(){
        var $ = layui.$
            ,like_area = layui.like_area
            ,form = layui.form
            ,like = layui.like
            ,laydate = layui.laydate
            ,txMap = layui.txMap;
        var customTxMap = layui.customTxMap;

        // 触发事件
        var active = {
            addUser: function(obj){
                layer.open({
                    type: 2
                    ,title: '用户列表'
                    ,content: '{:url("selffetch_verifier/userLists")}'
                    ,area: ['90%','90%']
                    ,btn: ['确定', '取消']
                    ,yes: function(index, layero){
                        layer.closeAll();
                    }
                    ,btn2: function(index, layero){
                        $('#user_id').val(user_id);
                        $('#user_name').html(user_name);
                    }
                });
            }
        };
        $('#layerDemo .layui-btn').on('click', function(){
            var othis = $(this), method = othis.data('method');
            active[method] ? active[method].call(this, othis) : '';
        });

        /*************************省市区三级联动**********************************************/
        var area = {$area_lists | raw};
        var default_province = $("#default_province").val();
        var default_city = $("#default_city").val();
        var default_district = $("#default_district").val();

        setSelectFirst(default_province);
        setSelectSecond(default_city,default_province);
        setSelectThird(default_district,default_city);

        function setSelectFirst(default_id) {
            var category_select_html = '';
            for (var i in area) {
                if (area[i]['level'] == 1) {
                    category_select_html += '<option value="' + area[i]['id'] + '">' + area[i]['name'] + '</option>';
                }
            }
            $('select[name="province"]').html(category_select_html);
            $('select[name="province"]').val(default_id);
            form.render('select');
        }
        function setSelectSecond(default_id, pid) {
            pid = pid === undefined ? $('select[name="province"]').val() : pid;
            $('select[name="city"]').html('');
            $('select[name="district"]').html('');
            var category_select_html = '';
            for (var i in area) {
                if (area[i]['pid'] == pid) {
                    category_select_html += '<option value="' + area[i]['id'] + '">' + area[i]['name'] + '</option>';
                }
            }
            $('select[name="city"]').html(category_select_html);
            $('select[name="city"]').val(default_id);
            form.render('select');
        }
        function setSelectThird(default_id, pid) {
            pid = pid === undefined ? $('select[name="city"]').val() : pid;
            $('select[name="district"]').html('');
            var province = $('select[name="province"]').val();
            var category_select_html = '';
            for (var i in area) {
                if (area[i]['pid'] == pid) {
                    category_select_html += '<option value="' + area[i]['id'] + '">' + area[i]['name'] + '</option>';
                }
            }
            $('select[name="district"]').html(category_select_html);
            $('select[name="district"]').val(default_id);
            form.render('select');
        }

        form.on('select(province)', function (data) {
            setSelectSecond('', data.value);
        });
        form.on('select(city)', function (data) {
            setSelectThird('', data.value);
        });


        /*************************地图**********************************************/
            // txMap.init("{$info.latitude ?? ''}", "{$info.longitude ?? ''}");
        var longitude = "{$info.longitude ?? ''}";
        var latitude = "{$info.latitude ?? ''}";
        if (longitude.length > 0 && latitude.length > 0) {
            customTxMap.initMap('map-container',longitude,latitude);
        } else {
            customTxMap.initMap('map-container');
        }
        //搜索地图
        $("#search_map").click(function () {
            var province = $("#province");
            var city = $("#city");
            var district = $("#district");
            var address = $("input[name='address']").val();
            if(province.val() == 0){
                layer.open({icon:2,time:2000,content:"请选择省份"});
                return;
            }
            if(city.val() == 0){
                layer.open({icon:2,time:2000,content:"请选择市"});
                return;
            }
            if(district.val() == 0){
                layer.open({icon:2,time:2000,content:"请选择镇/区"});
                return;
            }
            intactAddress = province.find("option:selected").text() + city.find("option:selected").text() + district.find("option:selected").text() + address;
            customTxMap.searchMap(intactAddress);
        })
    })
</script>
