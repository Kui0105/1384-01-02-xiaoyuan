{layout name="layout2" /}
<style>
    .layui-form-label {
        color: #6a6f6c;
    }
    .goods-li {
        float: left;
        opacity: 1;
        position: relative;
    }

    .goods-img {
        width: 80px;
        height: 80px;
        padding: 4px;
    }
    .goods-img-del-x {
        position: absolute;
        z-index: 100;
        top: -4px;
        right: -2px;
        width: 20px;
        height: 20px;
        font-size: 16px;
        line-height: 16px;
        color: #fff;
        text-align: center;
        cursor: pointer;
        background: hsla(0, 0%, 60%, .6);
        border-radius: 10px;
    }

    #image{
        left:110px;
    }
    #notice{ left:110px;}
</style>
<div class="layui-form" lay-filter="layuiadmin-form-category" id="layuiadmin-form-category" style="padding: 20px 30px 0 0;">
    <input type="hidden" value="{$article.id}" name="id">
    <div class="layui-form-item">
        <label class="layui-form-label">类型</label>
        <div class="layui-input-inline" id="" >
            <input disabled readonly type="radio" name="small_type" lay-filter="small_type" style="width: 500px" value=1 title="文章"  {if condition="$article.small_type eq 1" }checked{/if} >
            <input disabled readonly type="radio" name="small_type" lay-filter="small_type" style="width: 500px" value=2 title="视频" {if condition="$article.small_type eq 2" }checked{/if}>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label"><font color="red">*</font>标题</label>
        <div class="layui-input-block">
            <input type="text" name="title" value="{$article.title}" lay-verify="required"   lay-verType="tips"  placeholder="请输入标题" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label"><font color="red">*</font>分类</label>
        <div class="layui-input-block">
            <select name="cid"  placeholder="请选择分类" >
                {foreach $category_list as $val}
                <option value="0" readonly disabled>{$val.name}</option>
                {foreach $val['child'] as $son}
                <option value="{$son.id}" {if condition="$son.id eq $article.cid "}selected="selected"{/if} >|--   {$son.name}</option>
                {/foreach}
                {/foreach}
            </select>
        </div>
    </div>
<!--    <div class="layui-form-item">-->
<!--        <label class="layui-form-label">简介</label>-->
<!--        <div class="layui-input-block">-->
<!--            <input type="text"  name="synopsis" value="{$article.synopsis}" placeholder="请输入简介" class="layui-input">-->
<!--        </div>-->
<!--    </div>-->
    <div class="layui-form-item">
        <label class="layui-form-label">封面图</label>
        <div class="layui-input-inline">
            <div style="height:80px;line-height:80px">
                <input name="image" type="hidden" value="{$article.image}">

                {if !empty($article.image)}
                <div class="goods-img-add" style="display: none" ></div>
                <div class="goods-li">
                    <img class="goods-img" src="{$article.abs_image}">
                    <a class="goods-img-del-x" style="display: none">x</a>
                </div>
                {else}
                <div class="goods-img-add" ></div>
                {/if}
            </div>
        </div>
        <div class="layui-form-item">
            <label class=" layui-form-mid layui-word-aux" id="image">建议尺寸：500*500像素</label>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">排序</label>
        <div class="layui-input-block">
            <input type="number"  value="{$article.sort}" name="sort"  placeholder="请输入排序" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline" >
            <input type="radio" name="is_show" lay-filter="is_show" style="width: 500px" value=1 title="显示" {if condition="$article.is_show eq 1" }checked{/if}>
            <input type="radio" name="is_show" lay-filter="is_show" style="width: 500px" value=0 title="隐藏"{if condition="$article.is_show eq 0" }checked{/if}>
        </div>
    </div>
    <div class="layui-form-item type_video" {if condition="$article.small_type eq 1" }style="display: none" {/if}>
        <label class="layui-form-label">视频：</label>
        <div class="upload-file-div video-style" id="video">
            <a href="#" class="upload-file-title">+添加视频</a>
        </div>

    </div>
    <div class="layui-form-item type_video" {if condition="$article.small_type eq 1" }style="display: none" {/if} ><label class="layui-form-label"></label><span
            style="color: #a3a3a3;font-size: 9px">手机端播放，建议时长9-30秒，建议视频宽高比16:9</span>
    </div>
    <div class="layui-form-item type_article" {if condition="$article.small_type eq 2" }style="display: none" {/if}>
        <label class="layui-form-label">内容</label>
        <div class="layui-input-block">
            <textarea  name="content" id="content" lay-verify="content" class="field-content">{$article.content}</textarea>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">底部插图</label>
        <div class="layui-input-inline">
            <div style="height:80px;line-height:80px">
                <input name="foot_img" type="hidden" value="{$article.foot_image}">

                {if !empty($article.foot_img)}
                <div class="goods-img-add" style="display: none" ></div>
                <div class="goods-li">
                    <img class="goods-img" src="{$article.foot_image}">
                    <a class="goods-img-del-x" style="display: none">x</a>
                </div>
                {else}
                <div class="goods-img-add" ></div>
                {/if}
            </div>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">插图链接</label>
        <div class="layui-input-block">
            <input type="text" name="foot_url" value="{$article.foot_url}"    lay-verType="tips"  placeholder="请输入插图链接" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="edit-article-submit" id="edit-article-submit" value="确认">
    </div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','likeedit','like','layedit'], function(){
        var $ = layui.$
            ,form = layui.form
            ,like = layui.like
            // ,likeedit = layui.likeedit;
            ,likeedit = layui.layedit;
        //富文本上传图片
        likeedit.set({
            uploadImage: {
                url: "{:url('file/image')}",
                type: 'post'
            }
        })
        var content = likeedit.build('content'); //建立编辑器
        form.verify({

            content: function() {
                likeedit.sync(content)
            }
        })
        //上传图片
        like.imageUpload('.goods-img-add', function (uri, element) {
            if(uri.length>1){
                layer.msg('最多最能选中1张图片');
                return;
            }
            var html = '<div class="goods-li">\n' +
                '<img class="goods-img" ' +
                'src="' + uri[0] + '">' +
                '<a class="goods-img-del-x">x</a>' +
                '</div>';
            element.prev().val(like.getUrlFileName(uri[0], '{$storageUrl}'));
            element.parent().append(html);
            element.css('display','none');
        }, true);
        //删除图片
        $(document).on('click', '.goods-img-del-x', function () {
            $(this).parent().siblings('input').val('');
            $(this).parent().prev().css('display','block');
            $(this).parent().remove();
        });
        //显示图片
        $(document).on('click', '.goods-img', function () {
            var image = $(this).attr('src');
            like.showImg(image,600);
        });

        //  删除按钮的显示与隐藏
        $(document).on('mouseover', '.goods-img', function () {
            $(this).next().show();
        });
        $(document).on('mouseout', '.goods-img', function () {
            $(this).next().hide();
        });
        $(document).on('mouseover', '.goods-img-del-x', function () {
            $(this).show();
        });
        $(document).on('mouseout', '.goods-img-del-x', function () {
            $(this).hide();
        });

        form.on('radio(small_type)', function (data) {
            if (data.value != 1) {
                $('.type_video').show();
                $('.type_article').hide();
            } else {
                $('.type_video').hide();
                $('.type_article').show();
            }
        })

        // ========= 视频上传 开始
        $('#video').click(function(){
            layer.open({
                type: 2,
                title: '上传视频',
                content: '{:url("file_new/lists")}?type=video',
                area: ['90%', '90%']
            });
        });

        window.videoCallback = function(uris) {
            like.videoCallback(uris);
        };
        var article_info= {$article|raw|default=''};
        if(article_info['small_type']==2 && article_info['content']){
            like.videoCallback([article_info['content']]);
        }
        // ========== 视频上传 结束
    });
</script>
