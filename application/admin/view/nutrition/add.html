{layout name="layout2" /}
<style>
    .layui-form-label {
        color: #6a6f6c;
        width: 100px;
    }
</style>
<div class="layui-form" lay-filter="layuiadmin-form-category" id="layuiadmin-form-category" style="padding: 20px 30px 0 0;">

    <div class="layui-form-item">
        <label class="layui-form-label"><font color="red">*</font>标题</label>
        <div class="layui-input-block">
            <input type="text" name="name" lay-verify="required" lay-verType="tips" placeholder="请输入标题" autocomplete="off" class="layui-input" style="width: 90%">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label"><font color="red">*</font>分类</label>
        <div class="layui-input-inline">
            <select name="cid"  placeholder="请选择分类" >
                <option value="0">请选择分类</option>
                {foreach $category as $val}
                <option value="{$val.id}">{$val.name}</option>
                {/foreach}
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">蛋白质/赖氨酸</label>
        <div class="layui-input-inline">
            <input type="number"  name="protein_lysine"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > g</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">B族维生素</label>
        <div class="layui-input-inline">
            <input type="number"  name="vb"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > mg</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">维生素D</label>
        <div class="layui-input-inline">
            <input type="number"  name="vd"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > ug</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">铁</label>
        <div class="layui-input-inline">
            <input type="number"  name="iron"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > mg</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">锌</label>
        <div class="layui-input-inline">
            <input type="number"  name="zinc"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > mg</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">维生素A</label>
        <div class="layui-input-inline">
            <input type="number"  name="va"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > ug</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">钙</label>
        <div class="layui-input-inline">
            <input type="number"  name="calcium"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > mg</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">膳食纤维</label>
        <div class="layui-input-inline">
            <input type="number"  name="dietary_fiber"  placeholder="请输入" class="layui-input">
        </div>
        <div  class="layui-form-mid" > g</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">排序</label>
        <div class="layui-input-inline">
            <input type="number"  name="sort" value="0" placeholder="请输入排序" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="add-food-submit" id="add-food-submit" value="确认">
    </div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','like'], function(){
        var $ = layui.$
            ,form = layui.form
            ,like = layui.like;

    });
</script>
