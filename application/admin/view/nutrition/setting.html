    layui.config({

    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index','table','like'], function(){
        var $ = layui.$
            ,form = layui.form
            ,like = layui.like;

        form.on('submit(setPoint)',function (data) {
            like.ajax({
                url: '{:url("nutrition/setSetting")}'
                ,data: data.field
                ,type: 'post'
                ,success: function(res){
                    if(res.code == 1) {
                        layer.msg(res.msg, {
                            offset: '15px'
                            ,icon: 1
                            ,time: 1500
                        });
                    }
                },
            });
        });

    });

</script>
