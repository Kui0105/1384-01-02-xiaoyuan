{layout name="layout2" /}
<div class="layui-form" lay-filter="layuiadmin-form-category" id="layuiadmin-form-category" style="padding: 20px 30px 0 0;">
    <input type="hidden" value="0" name="id">
    <div class="layui-form-item">
        <label class="layui-form-label">分类名称</label>
        <div class="layui-input-block">
            <input type="text" name="name" lay-verify="required" lay-verType="tips"  placeholder="请输入名称" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">父级分类：</label>
        <div class="layui-input-inline">
            <select name="pid" lay-verify="required" placeholder="请选择父级分类" lay-filter="search_pid">
                <option value="0" data-level="1">顶级分类</option>
                {foreach $category_list as  $val}
                <option value="{$val.id}" data-level={$val.level}>{$val.name}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">分类状态</label>
        <div class="layui-input-inline" id="" >
            <input type="radio" name="is_show" lay-filter="is_show" style="width: 500px" value=1 title="启用"  checked>
            <input type="radio" name="is_show" lay-filter="is_show" style="width: 500px" value=0 title="停用">
        </div>
    </div>
    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="add-article_category-submit" id="add-article_category-submit" value="确认">
    </div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form'], function(){
        var $ = layui.$
            ,form = layui.form ;
    })
</script>
