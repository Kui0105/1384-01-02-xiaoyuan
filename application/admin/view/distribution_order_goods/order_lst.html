{layout name="layout1" /}
<style>
    .search {
        margin-top: 15px;
        margin-bottom: 15px;
    }
    .search .layui-form-label {
        width: 60px;
        text-align: right;
    }
    .layui-inline {
        margin-top: 5px;
    }
    .layui-table-cell {
        height:auto;
    }
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <!--操作提示-->
            <div class="layui-collapse like-layui-collapse" lay-accordion="" style="border:1px dashed #c4c4c4">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title like-layui-colla-title" style="background-color: #fff">操作提示</h2>
                    <div class="layui-colla-content layui-show">
                        <p>*诊所当面付订单明细；</p>
                    </div>
                </div>
            </div>
            <!--搜索区域-->
            <div class="search layui-form">
                <div class="layui-inline">
                    <div class="layui-form-label">订单信息</div>
                    <div class="layui-input-inline">
                        <input type="text" id="order_keyword" name="order_keyword" placeholder="订单编号" class="layui-input" />
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-form-label">买家信息</div>
                    <div class="layui-input-inline">
                        <input type="text" id="user_keyword" name="user_keyword" placeholder="名称" class="layui-input" />
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-form-label">诊所名称</div>
                    <div class="layui-input-inline">
                        <input type="text" id="hos_name" name="hos_name" placeholder="名称" class="layui-input" />
                    </div>
                </div>

                <div class="layui-inline">
                    <div class="layui-form-label">支付状态</div>
                    <div class="layui-input-inline">
                        <select name="pay_status" id="pay_status"  placeholder="请选择" >
                            <option value="">全部</option>
                            <option value="0">待支付</option>
                            <option value="1">已支付</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-primary layui-bg-blue" lay-submit lay-filter="search">搜索</button>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="reset">重置</button>
                </div>
            </div>
            <!--数据表格-->
            <table id="lists" lay-filter="lists"></table>
            <!--自定义模板-->
            <script type="text/html" id="order-info">
                <div class="layui-input-inline"  style="text-align: left;">
                    <p>订单编号:{{d.order_sn}}</p>
                    <p style="width: 200px;text-overflow:ellipsis;overflow: hidden">下单时间:{{d.create_time}}</p>
                </div>
            </script>
            <script type="text/html" id="user-info">
                <img src="{{d.avatar}}" style="height:60px;width: 60px" class="image-show">
                <div class="layui-input-inline"  style="text-align: left;">
                    <p>用户ID:{{d.user_id}}</p>
                    <p>用户昵称:{{d.nickname}}</p>
                    <p>用户电话:{{d.mobile}}</p>
                </div>
            </script>
            <script type="text/html" id="goods-info">
                <div class="layui-input-inline"  style="text-align: left;">
                    <p>支付状态:{{d.pay_status_str}}</p>
                    <p>支付金额:{{d.order_amount}}</p>
                    <p>支付时间:{{d.pay_time}}</p>
                    <p>支付流水号:{{d.transaction_id}}</p>
                </div>
            </script>
            <script type="text/html" id="hos-user-info">
                <img src="{{d.user_info.avatar}}" style="height:60px;width: 60px" class="image-show">
                <div class="layui-input-inline"  style="text-align: left;">
                    <p>用户ID:{{d.hos_user_id}}</p>
                    <p>用户昵称:{{d.user_info.nickname}}</p>
                    <p>用户电话:{{d.user_info.mobile}}</p>
                </div>
            </script>
            <script type="text/html" id="hos-info">
                {{#  if(d.hos_data.imgs){ }}
                <img src="{{d.hos_data.imgs}}" style="height:60px;width: 60px" class="image-show">
                {{#  } }}
                <div class="layui-input-inline"  style="text-align: left;">
                    <p>姓名:{{d.hos_data.name}}</p>
                    <p>电话:{{d.hos_data.mobile}}</p>
                    <p>店名:{{d.hos_data.hos_name}}</p>
                </div>
            </script>
        </div>
    </div>
</div>


<script>

    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/modules/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['table', 'form', 'like'], function () {
        let $ = layui.$
            , form = layui.form
            , like = layui.like
            , table = layui.table;

        //监听搜索
        form.on('submit(search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('lists', {
                where: field,
                page: {curr: 1}
            });
        });

        //图片放大
        $(document).on('click', '.image-show', function () {
            var src = $(this).attr('src');
            like.showImg(src,600);
        });

        //清空查询
        form.on('submit(reset)', function(){
            $('#order_keyword').val('');
            $('#user_keyword').val('');
            $('#pay_status').val('');
            $('#hos_name').val('');
            form.render('select');
            //刷新列表
            table.reload('lists', {
                where: [], page: {curr: 1}
            });
        });

        // 数据表格渲染
        table.render({
            elem: '#lists'
            ,url: '{:url("distribution_order_goods/order_lst")}' //数据接口
            ,method: 'post'
            ,page: true //开启分页
            ,cols: [[ //表头
                {templet: '#order-info', title: '订单信息', width:280}
                ,{templet: '#user-info', title: '买家信息', width:280}
                ,{templet: '#goods-info', title: '支付信息', width:280}
                ,{templet: '#hos-info', title: '诊所信息', width:280}
                ,{templet: '#hos-user-info', title: '诊所用户信息', width:280}
            ]]
            , text: {none: '暂无数据！'}
            , parseData: function (res) { //将原始数据解析成 table 组件所规定的数据
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "count": res.data.count, //解析数据长度
                    "data": res.data.lists, //解析数据列表
                };
            },
            response: {
                statusCode: 1
            }
            ,done: function(res, curr, count){
                // 解决操作栏因为内容过多换行问题
                $(".layui-table-main tr").each(function (index, val) {
                    $($(".layui-table-fixed-l .layui-table-body tbody tr")[index]).height($(val).height());
                    $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());
                });
            }
        });


    });


</script>
