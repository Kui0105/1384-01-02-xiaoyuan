{layout name="layout1" /}
<style>
    .layui-table-cell {
        height: auto;
    }
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-collapse like-layui-collapse" lay-accordion="" style="border:1px dashed #c4c4c4">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title like-layui-colla-title" style="background-color: #fff">操作提示</h2>
                    <div class="layui-colla-content layui-show">
                        <p>*骨龄测评，上传PDF后测评完成。</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">用户信息</label>
                    <div class="layui-input-block">
                        <input type="text" name="title" id="title" placeholder="请输入" autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-inline">
                    <label class="layui-form-label">宝宝姓名</label>
                    <div class="layui-input-block">
                        <input type="text" name="baby_name" id="baby_name" placeholder="请输入" autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <select name="status"  id="status" >
                            <option value="">全部</option>
                            <option value="1">待上传结果</option>
                            <option value="2">已测评</option>
                        </select>
                    </div>
                </div>


                <div class="layui-inline">
                    <button class="layui-btn layui-btn-sm  layuiadmin-btn-article {$view_theme_color}" lay-submit lay-filter="article-search">
                        <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                    </button>
                    <button class="layui-btn layui-btn-sm layui-btn-primary layuiadmin-btn-article }" lay-submit lay-filter="article-clear-search">重置</button>
                </div>
            </div>
        </div>

        <div class="layui-card-body">

            <table id="article-lists" lay-filter="article-lists"></table>
            <script type="text/html" id="user-info">
                <img src="{{d.avatar}}" style="height:80px;width: 80px;margin-right: 10px;" class="image-show">
                <div class="layui-input-inline" style="text-align:left;">
                    <p>电话：{{d.mobile}}</p>
                    <p>昵称：{{d.nickname}}</p>
                </div>
            </script>

            <script type="text/html" id="baby-info">
                <img src="{{d.head_img}}" style="height:80px;width: 80px;margin-right: 10px;" class="image-show">
                <div class="layui-input-inline" style="text-align:left;">
                    <p>名称：{{d.name}}</p>
                    <p>性别：{{d.sex_str}}</p>
                </div>
            </script>

            <script type="text/html" id="article-operation">
                <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="view">用户PDF</a>
                {{#  if(!d.check_result){ }}
                <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="pdf">上传PDF</a>
                {{# }else{ }}
                <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="view_result">结果PDF</a>
                {{#  } }}
            </script>
        </div>
    </div>
</div>

<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index','table','like'], function(){
        var $ = layui.$
            ,form = layui.form
            ,table = layui.table
            ,like = layui.like;

        //图片放大
        $(document).on('click', '.image-show', function () {
            var src = $(this).attr('src');
            like.showImg(src,600);
        });
        //监听搜索
        form.on('submit(article-search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('article-lists', {
                where: field,
                page: {
                    curr: 1 //重新从第 1 页开始
                },

            });
        });
        //监听重置
        form.on('submit(article-clear-search)', function(){
            $('#title').val('');
            $('#baby_name').val('');
            $('#status').val('');
            form.render('select');
            //刷新列表
            table.reload('article-lists', {
                where: [],
                page: {
                    curr: 1 //重新从第 1 页开始
                }
            });
        });

        $('.layui-btn.layuiadmin-btn-article').on('click', function(){
            var type = $(this).data('type');
            active[type] ? active[type].call(this) : '';
        });


        table.render({
            elem: '#article-lists'
            ,url: '{:url("BabyCheck/bone_lists")}'
            ,cols: [[
                {field: 'user', title: '用户信息',toolbar: '#user-info',width:300}
                ,{field: 'baby', title: '宝宝信息',toolbar: '#baby-info',width:280}
                ,{field: 'age', title: '测评年龄',width:150}
                ,{field: 'status_text', title: '状态',width:100}
                ,{field: 'check_date', title: '测评时间',width:160}
                ,{field: 'create_time', title: '创建时间',width:160}
                ,{fixed: 'right', title: '操作', align: 'center', toolbar: '#article-operation',width:230}
            ]]
            ,page:true
            ,text: {none: '暂无数据！'}
            ,parseData: function(res){ //将原始数据解析成 table 组件所规定的数据
                return {
                    "code":res.code,
                    "msg":res.msg,
                    "count": res.data.count, //解析数据长度
                    "data": res.data.lists, //解析数据列表
                };
            }
            ,done: function(res, curr, count){
                setTimeout(function () {
                    // 解决操作栏因为内容过多换行问题
                    $(".layui-table-fixed-l .layui-table-body").removeAttr("style");
                    $(".layui-table-fixed-r .layui-table-body").removeAttr("style");
                    $(".layui-table-main tr").each(function (index, val) {
                        console.log($(val).height());
                        $($(".layui-table-fixed-l .layui-table-body tbody tr")[index]).height($(val).height());
                        $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());
                    });
                }, 100)
            }
        });

        //监听工具条
        table.on('tool(article-lists)', function(obj){
            if(obj.event === 'view'){
                var pdf = obj.data.user_pdf;
                layer.open({
                    type: 2,
                    title: '查看用户PDF',
                    content: pdf, // 直接使用PDF文件的URL
                    area: ['90%', '90%'],
                    btn: false // 不需要按钮
                });

            }else if(obj.event === 'view_result'){
                var pdf = obj.data.check_result;
                layer.open({
                    type: 2,
                    title: '查看结果PDF',
                    content: pdf, // 直接使用PDF文件的URL
                    area: ['90%', '90%'],
                    btn: false // 不需要按钮
                });

            }else if (obj.event === 'pdf') {
                var id = obj.data.id;
                layer.open({
                    type: 2
                    ,title: '上传结果PDF'
                    ,content: '{:url("BabyCheck/upload_pdf")}?id='+id
                    ,area: ['50%', '50%']
                    ,btn: ['确定', '取消']
                    ,yes: function(index, layero){
                        var iframeWindow = window['layui-layer-iframe'+ index]
                            ,submit = layero.find('iframe').contents().find('#pdf-submit');
                        //监听提交
                        iframeWindow.layui.form.on('submit(pdf-submit)', function(data){
                            var field = data.field;
                            $.ajax({
                                url:'{:url("BabyCheck/upload_pdf")}',
                                data:field,
                                type:"post",
                                success:function(res)
                                {
                                    if(res.code == 1)
                                    {
                                        layui.layer.msg(res.msg, {
                                            offset: '15px'
                                            , icon: 1
                                            , time: 1000
                                        });
                                        layer.close(index); //关闭弹层
                                        table.reload('article-lists'); //数据刷新
                                    }else{
                                        layer.msg(res.msg, {
                                            offset: '15px'
                                            , icon: 2
                                            , time: 1000
                                        });
                                    }
                                }
                            });
                        });
                        submit.trigger('click');
                    }
                })
            }
        });
    });



</script>
