{layout name="layout2" /}
<style>
    .layui-form-label {
        width: 120px;
    }
    .pay-li {
        float: left;
        opacity: 1;
        position: relative;
    }
    .pay-img {
        width: 80px;
        height: 80px;
        padding: 4px;
    }
    .pay-img-del-x {
        position: absolute;
        z-index: 100;
        top: -4px;
        right: -2px;
        width: 20px;
        height: 20px;
        font-size: 16px;
        line-height: 16px;
        color: #fff;
        text-align: center;
        cursor: pointer;
        background: hsla(0, 0%, 60%, .6);
        border-radius: 10px;
    }


    .cert-add{
        height: 80px;
        width: 80px;
        float: left;
        opacity: 1;
        position: relative;
        border:1px dashed #a0a0a0;
        background-image:url('/static/common/image/default/add_file.png');
        background-repeat: no-repeat;
        background-position: 50% 35%;
        background-size:40px 40px;
        margin: 4px;
        text-align: center;
    }
    .upload-cert-a{
        cursor: pointer;
        position: absolute;
        z-index: 100;
        top: 58px;
        right: -10%;
        width: 100px;
        height: 20px;
        font-size: 8px;
        line-height: 16px;
        text-align: center;
        border-radius: 10px;
        color: #4e8bff;
    }
    .upload-cert-a:hover {
        color: #0641cb;
    }
    .pay-cert{
        height:80px;line-height:80px
    }


</style>
<div class="layui-form" lay-filter="layuiadmin-form-official" id="layuiadmin-form-official" style="padding: 20px 30px 0 0;">


    <!--PDF-->
    <div class="layui-form-item">
        <label class="layui-form-label">PDF：</label>
        <div class="layui-inline">
            <div class="pay-cert">
                <input class="text" type="hidden" name="id" value="{$id}" >
                <input class="text" type="hidden" name="pdf" value="" >
                <div class="cert-add" style="cursor: pointer;">
                    <a class="upload-cert-a">+ 添加文件</a>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-form-item">
        <div class="layui-form-item layui-hide">
            <input type="button" lay-submit lay-filter="pdf-submit" id="pdf-submit" value="确认">
        </div>
    </div>
</div>
<script>
    layui.config({
        version:"{$front_version}",
        base: '/static/plug/layui-admin/dist/layuiadmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form','like','upload'], function(){
        var $ = layui.$
            ,form = layui.form
            ,like = layui.like
            ,upload = layui.upload;


        //==========================================上传证书start=========================================================

        like.pdfUpload('.cert-add', '{:url("file/other")}?local=0&sub_dir=pdf', '{$storageUrl}');

        //==========================================上传证书end======================================================

        //  删除按钮的显示与隐藏
        $(document).on('mouseover', '.pay-img', function () {
            $(this).next().show();
        });
        $(document).on('mouseout', '.pay-img', function () {
            $(this).next().hide();
        });
        $(document).on('mouseover', '.pay-img-del-x', function () {
            $(this).show();
        });
        $(document).on('mouseout', '.pay-img-del-x', function () {
            $(this).hide();
        });

        //删除图片/证书
        $(document).on('click', '.pay-img-del-x', function () {
            $(this).parent().siblings('input').val('');
            $(this).parent().siblings().css('display','block');
            $(this).parent().remove();
        });


    })
</script>
