<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>个人资料</title>
    <link rel="stylesheet" href="/static/plug/layui-admin/dist/layuiadmin/layui/css/layui.css" media="all">
    <style>
        body { padding: 20px; font-family: "Microsoft YaHei", Arial, sans-serif; }
        .pf-avatar { width: 64px; height: 64px; border-radius: 50%; background: #EBF4FF; color: #3A91FB; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px; }
        .pf-head { text-align: center; margin-bottom: 20px; }
        .pf-head h3 { font-size: 17px; color: #333; }
        .pf-head p { font-size: 12px; color: #999; margin-top: 4px; }
        .pf-row { display: flex; padding: 12px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
        .pf-row .k { width: 110px; color: #999; }
        .pf-row .v { color: #333; flex: 1; }
        .pf-actions { margin-top: 22px; text-align: center; }
        .pf-actions button { width: 220px; }
    </style>
</head>
<body>
    <div class="pf-head">
        <div class="pf-avatar">{$doctor_initial}</div>
        <h3>{$doctor.name}</h3>
        <p>{$doctor.clinic_name}</p>
    </div>
    <div class="pf-row"><span class="k">账号（手机号）</span><span class="v">{$doctor.account}</span></div>
    <div class="pf-row"><span class="k">所属诊所</span><span class="v">{$doctor.clinic_name}</span></div>
    <div class="pf-row"><span class="k">上次登录</span><span class="v">{$doctor.login_time}</span></div>
    <div class="pf-row"><span class="k">账号状态</span><span class="v" style="color:#16b777">正常</span></div>

    <div class="pf-actions">
        <button type="button" class="layui-btn" id="btn-change-pwd">
            <i class="layui-icon layui-icon-password"></i> 修改密码
        </button>
    </div>

    <script src="/static/plug/layui-admin/dist/layuiadmin/layui/layui.js"></script>
    <script>
        layui.use(['layer'], function(){
            var $ = layui.$, layer = layui.layer;
            $('#btn-change-pwd').on('click', function(){
                layer.open({
                    type: 2,
                    title: '修改密码',
                    content: '/doctor/index/password.html',
                    area: ['520px', '480px'],
                    btn: [],
                    maxmin: false
                });
            });
        });
    </script>
</body>
</html>
