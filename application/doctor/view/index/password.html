<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>修改密码</title>
    <link rel="stylesheet" href="/static/plug/layui-admin/dist/layuiadmin/layui/css/layui.css" media="all">
    <style>
        body { padding: 22px 26px; font-family: "Microsoft YaHei", Arial, sans-serif; }
        .layui-form-label { width: 100px; }
        .layui-input-block { margin-left: 130px; }
        .pwd-tip { margin-top: 16px; padding: 10px 12px; background: #F5F9FF; border: 1px dashed #c9dffb; border-radius: 6px; font-size: 12px; color: #668; line-height: 1.8; }
        .submit-wrap { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <form class="layui-form" lay-filter="pwd-form">
        <div class="layui-form-item">
            <label class="layui-form-label">原密码</label>
            <div class="layui-input-block">
                <input type="password" name="old_password" required lay-verify="required" placeholder="请输入当前登录密码" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">新密码</label>
            <div class="layui-input-block">
                <input type="password" name="new_password" required lay-verify="required" placeholder="请输入新密码（至少6位）" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">重复新密码</label>
            <div class="layui-input-block">
                <input type="password" name="confirm_password" required lay-verify="required" placeholder="请再次输入新密码" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="pwd-tip">
            <div>安全提示：</div>
            <div>1. 新密码长度不少于 6 位，且不能与原密码相同。</div>
            <div>2. 修改成功后需使用新密码重新登录。</div>
        </div>

        <div class="submit-wrap">
            <button class="layui-btn" id="pwd-submit" lay-submit lay-filter="pwd-submit">确认修改</button>
            <button type="button" class="layui-btn layui-btn-primary" id="pwd-cancel">取消</button>
        </div>
    </form>

    <script src="/static/plug/layui-admin/dist/layuiadmin/layui/layui.js"></script>
    <script>
        layui.use(['form', 'layer'], function(){
            var form = layui.form, layer = layui.layer, $ = layui.$;

            $('#pwd-cancel').on('click', function(){
                var index = parent.layer.getFrameIndex(window.name);
                if (index) parent.layer.close(index);
            });

            form.on('submit(pwd-submit)', function(data){
                var load = layer.load(1, {shade: [0.1,'#fff']});
                $.ajax({
                    url: '/doctor/index/changePassword.html',
                    type: 'POST',
                    data: data.field,
                    dataType: 'json',
                    success: function(res){
                        layer.close(load);
                        if (res.code == 1) {
                            layer.msg(res.msg, {icon: 1, time: 1500}, function(){
                                // 退出登录，跳转登录页用新密码重新登录
                                location.href = '/doctor/login/logout.html';
                            });
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    },
                    error: function(){
                        layer.close(load);
                        layer.msg('请求失败，请重试', {icon: 2});
                    }
                });
                return false;
            });

            form.render();
        });
    </script>
</body>
</html>
