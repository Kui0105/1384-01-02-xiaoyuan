<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>医生工作台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/plug/layui-admin/dist/layuiadmin/layui/css/layui.css" media="all">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }

        .layout { display: flex; height: 100vh; }

        /* 侧边栏 */
        .sidebar {
            width: 210px; flex-shrink: 0; background: #fff;
            border-right: 1px solid #e8e8e8; display: flex; flex-direction: column;
        }
        .sidebar-logo {
            height: 60px; flex-shrink: 0; display: flex; align-items: center;
            padding: 0 18px; border-bottom: 1px solid #f0f0f0;
        }
        .sidebar-logo .icon {
            width: 34px; height: 34px; border-radius: 9px; background: #3A91FB;
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 19px; margin-right: 10px;
        }
        .sidebar-logo .txt { font-size: 15px; font-weight: 600; color: #252B33; }
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 10px 0; }
        .menu-group-title {
            padding: 14px 20px 6px; font-size: 11px; color: #bbb;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .menu-item {
            height: 44px; display: flex; align-items: center; padding: 0 20px;
            cursor: pointer; color: #555; font-size: 14px; border-left: 3px solid transparent;
            transition: all .15s; user-select: none;
        }
        .menu-item .layui-icon { font-size: 17px; margin-right: 10px; color: #888; }
        .menu-item:hover { background: #F7FAFF; color: #3A91FB; }
        .menu-item:hover .layui-icon { color: #3A91FB; }
        .menu-item.active {
            background: #EBF4FF; color: #3A91FB; font-weight: 500;
            border-left-color: #3A91FB;
        }
        .menu-item.active .layui-icon { color: #3A91FB; }
        .sidebar-foot {
            flex-shrink: 0; padding: 14px 18px; border-top: 1px solid #f0f0f0;
            font-size: 12px; color: #999;
        }

        /* 右侧主区 */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .header {
            height: 60px; flex-shrink: 0; background: #fff;
            border-bottom: 1px solid #e8e8e8; display: flex; align-items: center;
            justify-content: space-between; padding: 0 24px;
        }
        .header-left { font-size: 15px; color: #333; font-weight: 500; }
        .header-left .layui-icon { color: #3A91FB; margin-right: 6px; }
        .header-right { display: flex; align-items: center; gap: 18px; }
        .doctor-badge {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            padding: 4px 10px; border-radius: 18px; transition: background .15s;
        }
        .doctor-badge:hover { background: #f5f5f5; }
        .doctor-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: #EBF4FF;
            color: #3A91FB; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
        }
        .doctor-name { font-size: 13px; color: #333; }
        .doctor-clinic { font-size: 11px; color: #999; }
        .header-right a { font-size: 13px; color: #666; text-decoration: none; }
        .header-right a:hover { color: #3A91FB; }

        /* iframe 容器 */
        .content { flex: 1; position: relative; background: #f5f7fa; }
        .content iframe {
            position: absolute; width: 100%; height: 100%;
            border: none; background: #f5f7fa; display: none;
        }
        .content iframe.active { display: block; }
        .loading {
            position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; color: #999; font-size: 14px;
        }
    </style>
</head>
<body>
<div class="layout">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="icon"><i class="layui-icon layui-icon-user"></i></div>
            <div class="txt">医生工作台</div>
        </div>
        <div class="sidebar-menu">
            <div class="menu-group-title">工作区</div>
            <div class="menu-item active" data-url="/doctor/index/stat.html" data-title="工作台">
                <i class="layui-icon layui-icon-home"></i><span>工作台</span>
            </div>
            <div class="menu-item" data-url="/doctor/baby/index.html" data-title="儿童档案">
                <i class="layui-icon layui-icon-form"></i><span>儿童档案</span>
            </div>

            <div class="menu-group-title">内容中心</div>
            <div class="menu-item" data-url="/doctor/science/index.html" data-title="成长科普">
                <i class="layui-icon layui-icon-read"></i><span>成长科普</span>
            </div>
            <div class="menu-item" data-url="/doctor/video/index.html" data-title="视频课堂">
                <i class="layui-icon layui-icon-video"></i><span>视频课堂</span>
            </div>
        </div>
        <div class="sidebar-foot">
            <i class="layui-icon layui-icon-auz"></i> 小元优长 · 医生端
        </div>
    </div>

    <!-- 主区 -->
    <div class="main">
        <div class="header">
            <div class="header-left"><i class="layui-icon layui-icon-home"></i><span id="page-title">工作台</span></div>
            <div class="header-right">
                <div class="doctor-badge" id="doctor-badge">
                    <div class="doctor-avatar">{$doctor_initial}</div>
                    <div>
                        <div class="doctor-name">{$doctor.name}</div>
                        <div class="doctor-clinic">{$doctor.clinic_name}</div>
                    </div>
                </div>
                <a href="javascript:;" id="btn-profile">个人资料</a>
                <a href="/doctor/login/logout.html"><i class="layui-icon layui-icon-logout"></i> 退出</a>
            </div>
        </div>
        <div class="content" id="content">
            <div class="loading" id="loading">页面加载中...</div>
        </div>
    </div>
</div>

<script src="/static/plug/layui-admin/dist/layuiadmin/layui/layui.js"></script>
<script>
    layui.use(['layer'], function(){
        var $ = layui.$, layer = layui.layer;
        var content = $('#content');
        var frames = {};
        var currentKey = '';

        function loadPage($item){
            var url = $item.data('url');
            var title = $item.data('title');
            if(!url) return;
            $('#page-title').text(title);
            document.title = title + ' - 医生工作台';

            $('.menu-item').removeClass('active');
            $item.addClass('active');

            if(!frames[url]){
                var $frame = $('<iframe src="' + url + '" frameborder="0"></iframe>');
                frames[url] = $frame;
                content.append($frame);
                $frame.on('load', function(){ $('#loading').hide(); });
            }
            if(currentKey && frames[currentKey]) frames[currentKey].removeClass('active');
            frames[url].addClass('active');
            currentKey = url;
            $('#loading').show();
        }

        $('.menu-item').on('click', function(){ loadPage($(this)); });

        // 默认加载工作台
        loadPage($('.menu-item.active'));

        $('#btn-profile').on('click', function(){
            layer.open({
                type: 2, title: '个人资料',
                content: '/doctor/index/profile.html',
                area: ['560px','440px']
            });
        });

        $('#doctor-badge').on('click', function(){
            $('#btn-profile').trigger('click');
        });
    });
</script>
</body>
</html>
