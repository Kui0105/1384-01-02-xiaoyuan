<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>医生端 - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/plug/layui-admin/dist/layuiadmin/layui/css/layui.css" media="all">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #3A91FB 0%, #1E6FD9 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .login-bg-deco { position: fixed; border-radius: 50%; background: rgba(255,255,255,.06); }
        .deco1 { width: 420px; height: 420px; top: -120px; left: -100px; }
        .deco2 { width: 300px; height: 300px; bottom: -100px; right: -80px; }
        .login-box {
            position: relative; z-index: 2;
            width: 400px; background: #fff; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.15); padding: 40px 36px 30px;
        }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo .icon {
            width: 56px; height: 56px; margin: 0 auto 12px;
            background: #EBF4FF; color: #3A91FB; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        .login-logo h1 { font-size: 20px; color: #252B33; font-weight: 600; }
        .login-logo p { font-size: 13px; color: #999; margin-top: 4px; }
        .layui-form-label { width: 0; padding: 0; }
        .layui-input-block { margin-left: 0; }
        .input-wrap { position: relative; margin-bottom: 18px; }
        .input-wrap .layui-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #bbb; font-size: 16px; z-index: 2;
        }
        .input-wrap input {
            height: 44px; padding-left: 38px; border: 1px solid #e6e6e6;
            border-radius: 6px; background: #fafafa;
        }
        .input-wrap input:focus { background: #fff; border-color: #3A91FB; }
        .login-btn {
            width: 100%; height: 44px; border: none; border-radius: 6px;
            background: #3A91FB; color: #fff; font-size: 15px; cursor: pointer;
            margin-top: 6px; letter-spacing: 2px;
        }
        .login-btn:hover { background: #1E6FD9; }
        .login-tip {
            margin-top: 22px; padding: 12px 14px; background: #F5F9FF;
            border: 1px dashed #c9dffb; border-radius: 6px;
            font-size: 12px; color: #668; line-height: 1.9;
        }
        .login-tip b { color: #3A91FB; }
        .login-tip .fill { cursor: pointer; color: #1E6FD9; text-decoration: underline; }
        .login-footer { text-align: center; margin-top: 18px; font-size: 12px; color: #bbb; }
        .login-footer a { color: #3A91FB; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="login-bg-deco deco1"></div>
    <div class="login-bg-deco deco2"></div>

    <div class="login-box">
        <div class="login-logo">
            <div class="icon"><i class="layui-icon layui-icon-user"></i></div>
            <h1>医生工作台</h1>
            <p>小元优长 · 医生端登录</p>
        </div>

        <form class="layui-form" id="login-form">
            <div class="input-wrap">
                <i class="layui-icon layui-icon-username"></i>
                <input type="text" name="account" id="account" placeholder="请输入账号（手机号）" autocomplete="off" class="layui-input">
            </div>
            <div class="input-wrap">
                <i class="layui-icon layui-icon-password"></i>
                <input type="password" name="password" id="password" placeholder="请输入密码" autocomplete="off" class="layui-input">
            </div>
            <button type="button" class="login-btn" id="btn-login">登 录</button>
        </form>

        <div class="login-tip">
            <div><b>演示账号（Mock）：</b></div>
            <div>账号：<b>13800138001</b>　密码：<b>123456</b></div>
            <div><span class="fill" id="btn-fill">点击一键填充</span></div>
        </div>

        <div class="login-footer">
            <span>管理端请访问 /admin/</span>
        </div>
    </div>

    <script src="/static/plug/layui-admin/dist/layuiadmin/layui/layui.js"></script>
    <script>
        layui.use(['form', 'layer'], function(){
            var $ = layui.$, form = layui.form, layer = layui.layer;

            $('#btn-fill').on('click', function(){
                $('#account').val('13800138001');
                $('#password').val('123456');
            });

            function doLogin(){
                var account = $.trim($('#account').val());
                var password = $.trim($('#password').val());
                if(!account || !password){
                    layer.msg('请输入账号和密码', {icon: 2});
                    return;
                }
                var load = layer.load(1, {shade: [0.1,'#fff']});
                $.ajax({
                    url: '/doctor/login/check.html',
                    type: 'POST',
                    data: {account: account, password: password},
                    dataType: 'json',
                    success: function(res){
                        layer.close(load);
                        if(res.code == 1){
                            layer.msg(res.msg, {icon: 1, time: 800}, function(){
                                location.href = '/doctor/index/index.html';
                            });
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    },
                    error: function(){
                        layer.close(load);
                        layer.msg('请求失败，请重试', {icon: 2});
                    }
                });
            }

            $('#btn-login').on('click', doLogin);
            $(document).on('keydown', function(e){
                if(e.keyCode === 13) doLogin();
            });
        });
    </script>
</body>
</html>
